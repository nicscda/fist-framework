type: technique
id: T0011
name: 製作偽造資料/文件
tactic_id: TA0002
description: |
  詐騙者會偽造或拼湊看似可信的資料與文件（包含實體與數位形式），用於身分冒用、通過審核、建立權威性或降低受害者戒心，進而推動後續詐騙流程。常見偽造標的包含身分證件、公司/組織證明、公文或通知、合約與收據、銀行對帳單，以及電子郵件/簡訊等可作為「通知或證明」的訊息載體。

  詐騙者通常會模仿真實資料/文件的版面與細節，例如機關標誌、簽章、條碼/QR Code、水印、防偽線條、特定字體與措辭，或在數位文件中偽造寄件者資訊、郵件標頭與近似網域等特徵，以提高仿真度並降低被識破的機率。此類偽造資料/文件常被用於申辦門號、開設帳戶、申請貸款、土地或交易流程，以及搭配社交工程與釣魚手法強化說服力，可能造成個資外洩與財務損失，甚至衍生法律風險。

