type: technique
id: T0062.003
name: 製作假電子郵件信箱
tactic_id: TA0002
description: |
  詐騙者會建立或使用假電子郵件信箱，作為註冊帳號、對外聯繫或寄送釣魚郵件的入口，並透過看似正式的寄件者地址與簽名檔營造可信形象，將行動與真實身份切割以降低追查風險。

  假信箱可能採用一次性信箱或匿名郵件服務，或透過仿冒/近似網域建立與合法組織相似的寄件地址，以提高受害者誤判機率；同時也可搭配別名、轉寄與多信箱輪替規避封鎖。此類信箱常被用於收取驗證信、重設密碼流程，並與假帳號、假門號等資料串聯，形成完整的人設運作鏈路。

