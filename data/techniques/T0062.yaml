type: technique
id: T0062
name: 製作虛擬人設
tactic_id: TA0002
description: |
  詐騙者會建構一套虛構的人物身份（虛擬人設），在社群平台、交友軟體、通訊軟體或論壇中塑造可信的背景與形象，藉此取得受害者信任並引導其配合後續行動，例如提供個資、點擊連結、移轉資金、協助代收代付或加入特定群組等。

  詐騙者通常會為人設準備可被驗證的「外觀證據」，包含頭像與生活照、工作/學歷/經歷敘事、固定的說話語氣與作息、跨平台一致的帳號足跡，並透過長期互動、養號與多帳號互相背書來提高可信度；亦可能搭配自動化或生成式內容降低成本，使人設更難以被快速識破與追查。

