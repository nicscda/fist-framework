type: technique
id: T0062.001
name: 製作假帳號
tactic_id: TA0002
description: |
  詐騙者會建立、取得或操控社群媒體、通訊軟體、論壇或交易平台帳號，作為虛擬人設的載體或訊息投放管道，藉由與受害者互動建立關係，再進一步引導其進行匯款、提供驗證碼、交付敏感資訊或加入外部聯絡渠道等。

  假帳號可能透過一次性資料註冊、批量自動化建立、購買/盜用既有帳號或長期養號來提高帳號年齡與可信度，並以多帳號互動製造社交證據（如互粉、留言、按讚）以降低被懷疑的機率；同時也可用於分散風控風險、繞過封鎖名單，讓詐騙活動更具持續性。

