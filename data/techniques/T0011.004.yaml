type: technique
id: T0011.004
name: 製作假合約
tactic_id: TA0002
description: |
  詐騙者偽造看似正式且具法律效力的合約文件，用於營造交易或合作關係已成立的假象，藉此降低受害者戒心並推動後續行動，例如要求支付訂金/保證金、提供身分資料、交付財物或配合簽署其他文件等。

  詐騙者通常會仿照真實合約的格式與要素，例如公司抬頭與聯絡資訊、條款結構、印章/簽名、日期與編號、附件與收付款資訊等，並可能搭配偽造對方公司資料或引用既有範本拼貼，以提高仿真度。此類假合約常見於租賃、買賣、投資、承攬、雇用等情境，亦可與其他偽造資料/文件或社交工程手法結合，增加受害者誤信與受損風險。

