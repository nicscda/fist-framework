<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; img-src 'self' data: https:; manifest-src 'self' https://*.github.io https://github.com; script-src 'self'; style-src 'self';" />
  {%- seo -%}
  <link rel="stylesheet" href="{{- '/assets/main.css' | relative_url -}}" />
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  <!--begin::Favicon-->
  <link rel="icon" type="image/png" href="{{- '/assets/favicon-96x96.png' | relative_url -}}" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="{{- '/assets/favicon.svg' | relative_url -}}" />
  <link rel="shortcut icon" href="{{- '/assets/favicon.ico' | relative_url -}}" />
  <link rel="apple-touch-icon" sizes="180x180" href="{{- '/assets/apple-touch-icon.png' | relative_url -}}" />
  <meta name="apple-mobile-web-app-title" content="{{- site.title | escape -}}" />
  <link rel="manifest" href="{{- '/assets/site.webmanifest' | relative_url -}}" />
  <!--end::Favicon-->
  <script defer src="{{ '/assets/main.js' | relative_url }}"></script>
</head>
